sonar.projectKey=aimindseye_sablehealth-bridge
sonar.organization=aimindseye
sonar.projectName=Sable Health Bridge
sonar.sourceEncoding=UTF-8
sonar.sources=app/src/main,core/src/main,tools
sonar.tests=app/src/test,core/src/test,tests
sonar.java.binaries=app/build/tmp/kotlin-classes/debug,core/build/classes/kotlin/main
sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml,app/build/reports/coverage/test/debug/report.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Explicit test-source classification
sonar.test.inclusions=**/src/test/**,tests/**/*.py
