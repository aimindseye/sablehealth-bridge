name: SonarCloud
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.4.1'
      - name: Confirm SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          gradle --no-daemon --console=plain :core:test :core:jacocoTestReport :app:createDebugUnitTestCoverageReport :app:assembleDebug :app:lintDebug
          python3 tools/check-coverage.py
      - name: Measure Python helper tests
        run: |
          python3 -m venv "$RUNNER_TEMP/sbr1-coverage"
          "$RUNNER_TEMP/sbr1-coverage/bin/python" -m pip install --disable-pip-version-check coverage==7.13.3
          "$RUNNER_TEMP/sbr1-coverage/bin/python" -m coverage run --branch --source=tools -m unittest discover -s tests -v
          mkdir -p build
          "$RUNNER_TEMP/sbr1-coverage/bin/python" -m coverage xml -o build/python-coverage.xml
      - name: Verify generated analysis inputs
        run: |
          test -s "$GITHUB_WORKSPACE/core/build/reports/jacoco/test/jacocoTestReport.xml"
          test -s "$GITHUB_WORKSPACE/app/build/reports/coverage/test/debug/report.xml"
          test -s "$GITHUB_WORKSPACE/app/build/reports/lint-results-debug.xml"
          test -s "$GITHUB_WORKSPACE/build/python-coverage.xml"
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/core/build/reports/jacoco/test/jacocoTestReport.xml,${{ github.workspace }}/app/build/reports/coverage/test/debug/report.xml
            -Dsonar.androidLint.reportPaths=${{ github.workspace }}/app/build/reports/lint-results-debug.xml
            -Dsonar.python.coverage.reportPaths=${{ github.workspace }}/build/python-coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
